# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# Blinders (Google's 2024 security competition, by Google; a crypto challenge) as an Isoloom spec:
# a private set membership game: find which number from 0 to 255 is missing, with few queries.
# The challenge folder 2024/quals/crypto-blinders of Google's challenge archive is vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: google-ctf-2024-blinders

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.187.0/24, internet: false}

machines:
  challenge:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    privileged: true  # the image's setup script mounts /proc and nsjail creates namespaces
    seal: best-effort  # privileged on a sealed (internet: false) network: the seal is advisory here
    volumes: {ctf: /chroot}     # the flag, written by ctf/flag.sh at every start
    ports:
      challenge:
        port: 1337
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app/challenge

checks:
  - name: the challenge service answers
    tcp: challenge:1337
    wait: 120
  - name: the server reads a request and rejects an unknown one
    script: checks/probe.sh
    wait: 60

message: |
  Blinders (Google, 2024) answers at `nc localhost {{ machines.challenge.ports.challenge.published }}`.
  The server blinds its answers with a fresh key: what does it still reveal about which element is missing?
